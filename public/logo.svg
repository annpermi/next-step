<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Colors -->
  <!-- Navy: #1F3A5F -->
  <!-- Orange: #F58220 -->

  <!-- House Roof -->
  <polygon points="450,180 600,100 750,180" fill="#1F3A5F"/>
  
  <!-- House Left Wall -->
  <rect x="470" y="180" width="40" height="140" fill="#1F3A5F"/>
  
  <!-- House Base -->
  <rect x="450" y="320" width="300" height="20" fill="#F58220"/>

  <!-- Stairs -->
  <rect x="520" y="290" width="60" height="30" fill="#F58220"/>
  <rect x="580" y="260" width="60" height="30" fill="#F58220"/>
  <rect x="640" y="230" width="60" height="30" fill="#F58220"/>

  <!-- Chimney -->
  <rect x="710" y="120" width="40" height="80" fill="#F58220"/>

  <!-- Window -->
  <rect x="610" y="180" width="60" height="60" fill="#F58220"/>
  <line x1="640" y1="180" x2="640" y2="240" stroke="white" stroke-width="4"/>
  <line x1="610" y1="210" x2="670" y2="210" stroke="white" stroke-width="4"/>

  <!-- Company Name -->
  <text x="600" y="420" font-family="Arial, Helvetica, sans-serif" 
        font-size="110" font-weight="700" text-anchor="middle" fill="#1F3A5F">
    NEXTSTEP
  </text>

  <text x="600" y="500" font-family="Arial, Helvetica, sans-serif" 
        font-size="60" font-weight="600" text-anchor="middle" fill="#F58220" letter-spacing="8">
    CONSTRUCTION
  </text>

</svg>
