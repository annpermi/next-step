<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cedar shingle facade project</title>
  <desc id="desc">Stylized cedar shingle facade with white trim.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbe9f4"/>
      <stop offset="100%" stop-color="#f8fbfd"/>
    </linearGradient>
    <pattern id="shingle" width="34" height="20" patternUnits="userSpaceOnUse">
      <rect width="34" height="20" fill="#9a7b5f"/>
      <rect y="10" width="34" height="10" fill="#87664d"/>
      <path d="M0 10h34" stroke="#6d523f" stroke-width="1"/>
      <path d="M17 0v10" stroke="#6d523f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect y="620" width="1200" height="180" fill="#d8ccb6"/>
  <rect x="220" y="170" width="760" height="450" fill="url(#shingle)" rx="8"/>
  <polygon points="180,230 600,40 1020,230" fill="#c7d4dd"/>
  <rect x="315" y="290" width="170" height="210" fill="#f6f4ef" stroke="#d7d3c9" stroke-width="10"/>
  <rect x="515" y="260" width="170" height="240" fill="#f6f4ef" stroke="#d7d3c9" stroke-width="10"/>
  <rect x="715" y="290" width="170" height="210" fill="#f6f4ef" stroke="#d7d3c9" stroke-width="10"/>
  <rect x="555" y="430" width="90" height="190" fill="#f2efe9" stroke="#d7d3c9" stroke-width="8"/>
  <rect x="250" y="560" width="700" height="18" fill="#ece7de"/>
</svg>
